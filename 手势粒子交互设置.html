<body>

    <!-- Loading Screen -->
    <div class="loading-overlay" id="loading">
        <div class="loader"></div>
        <div>初始化视觉系统...</div>
        <div style="font-size: 12px; margin-top: 10px; opacity: 0.6;">正在加载MediaPipe手部追踪</div>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Status Indicator -->
    <div class="status-indicator">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">等待摄像头...</span>
    </div>

    <!-- Webcam Preview -->
    <div id="webcam-preview">
        <video id="webcam-video" playsinline></video>
        <canvas id="webcam-canvas"></canvas>
    </div>

    <!-- Control Panel -->
    <div class="control-panel">
        <h2 style="margin: 0 0 20px 0; font-size: 18px; font-weight: 600; background: linear-gradient(90deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            粒子模型选择
        </h2>
        
        <button class="model-btn active" onclick="setModel('nebula')">
            <span class="icon">🌌</span> 星云 (Nebula)
        </button>
        <button class="model-btn" onclick="setModel('firework')">
            <span class="icon">🎆</span> 烟花 (Firework)
        </button>
        <button class="model-btn" onclick="setModel('saturn')">
            <span class="icon">🪐</span> 土星 (Saturn)
        </button>
        <button class="model-btn" onclick="setModel('flower')">
            <span class="icon">🌸</span> 花朵 (Flower)
        </button>
        <button class="model-btn" onclick="setModel('galaxy')">
            <span class="icon">✨</span> 星系 (Galaxy)
        </button>

        <div class="section-title">视觉调整</div>
        
        <div class="slider-container">
            <div class="slider-label">
                <span>基础颜色</span>
            </div>
            <input type="color" id="colorPicker" value="#ff6b6b" onchange="updateBaseColor(this.value)">
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <span>粒子密度</span>
                <span id="density-value">8000</span>
            </div>
            <input type="range" id="densitySlider" min="1000" max="20000" value="8000" step="1000" oninput="updateDensity(this.value)">
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <span>辉光强度</span>
                <span id="bloom-value">1.5</span>
            </div>
            <input type="range" min="0" max="3" step="0.1" value="1.5" oninput="updateBloom(this.value)">
        </div>

        <div class="section-title">手势控制</div>
        <div style="font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.6;">
            • 手掌开合：控制粒子扩散<br>
            • 左右移动：旋转模型<br>
            • 上下移动：调整视角
        </div>
    </div>

    <!-- Fullscreen Button -->
    <button class="fullscreen-btn" onclick="toggleFullscreen()" title="全屏模式">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
        </svg>
    </button>

    <script>
        // Global Variables
        let scene, camera, renderer, composer;
        let particles, backgroundParticles;
        let hands, cameraUtils;
        let videoElement, canvasElement, canvasCtx;
        let currentModel = 'nebula';
        let baseColor = new THREE.Color(0xff6b6b);
        let particleCount = 8000;
        let bloomStrength = 1.5;
        let targetExpansion = 1;
        let currentExpansion = 1;
        let targetRotationX = 0;
        let targetRotationY = 0;
        let currentRotationX = 0;
        let currentRotationY = 0;
        let handDetected = false;
        let hueShift = 0;

        // Initialize Three.js Scene
        function initThree() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0008);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 50;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            container.appendChild(renderer.domElement);

            // Post-processing for Bloom
            const renderScene = new THREE.RenderPass(scene, camera);
            const bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                bloomStrength, 0.4, 0.85
            );
            bloomPass.threshold = 0;
            bloomPass.strength = bloomStrength;
            bloomPass.radius = 0.5;

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // Create Background Particles (Deep Space)
            createBackgroundParticles();

            // Create Initial Model
            createParticleModel(currentModel);

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            
            // Start Animation Loop
            animate();
        }

        function createBackgroundParticles() {
            const geometry = new THREE.BufferGeometry();
            const count = 3000;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 400;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 400;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 400;

                const color = new THREE.Color();
                color.setHSL(Math.random(), 0.8, 0.5);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                sizes[i] = Math.random() * 2;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.PointsMaterial({
                size: 0.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            backgroundParticles = new THREE.Points(geometry, material);
            scene.add(backgroundParticles);
        }

        function createParticleModel(type) {
            if (particles) {
                scene.remove(particles);
                particles.geometry.dispose();
                particles.material.dispose();
            }

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const originalPositions = new Float32Array(particleCount * 3);

            const color = baseColor;

            for (let i = 0; i < particleCount; i++) {
                let x, y, z;
                const t = Math.random();

                switch(type) {
                    case 'nebula':
                        // Spherical nebula with noise
                        const radius = 20 + Math.random() * 15;
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        x = radius * Math.sin(phi) * Math.cos(theta);
                        y = radius * Math.sin(phi) * Math.sin(theta);
                        z = radius * Math.cos(phi);
                        // Add noise
                        x += (Math.random() - 0.5) * 10;
                        y += (Math.random() - 0.5) * 10;
                        z += (Math.random() - 0.5) * 10;
                        break;

                    case 'firework':
                        // Explosion pattern
                        const r = Math.random() * 25;
                        const angle = Math.random() * Math.PI * 2;
                        const elevation = (Math.random() - 0.5) * Math.PI;
                        x = r * Math.cos(angle) * Math.cos(elevation);
                        y = r * Math.sin(elevation);
                        z = r * Math.sin(angle) * Math.cos(elevation);
                        break;

                    case 'saturn':
                        // Ring system
                        const ringRadius = 15 + Math.random() * 20;
                        const ringAngle = Math.random() * Math.PI * 2;
                        const thickness = (Math.random() - 0.5) * 3;
                        x = ringRadius * Math.cos(ringAngle);
                        y = thickness;
                        z = ringRadius * Math.sin(ringAngle);
                        // Planet core
                        if (Math.random() < 0.2) {
                            const coreR = Math.random() * 8;
                            const coreTheta = Math.random() * Math.PI * 2;
                            const corePhi = Math.acos(2 * Math.random() - 1);
                            x = coreR * Math.sin(corePhi) * Math.cos(coreTheta);
                            y = coreR * Math.sin(corePhi) * Math.sin(coreTheta);
                            z = coreR * Math.cos(corePhi);
                        }
                        break;

                    case 'flower':
                        // Petal pattern
                        const petalAngle = Math.random() * Math.PI * 2;
                        const petalDist = Math.random() * 20;
                        const petalHeight = Math.sin(petalAngle * 5) * 5 + (Math.random() - 0.5) * 5;
                        x = petalDist * Math.cos(petalAngle);
                        z = petalDist * Math.sin(petalAngle);
                        y = petalHeight * Math.exp(-petalDist/15) + (Math.random() - 0.5) * 3;
                        break;

                    case 'galaxy':
                        // Spiral arms
                        const armAngle = Math.random() * Math.PI * 2;
                        const armDist = Math.random() * 30;
                        const spiralOffset = armDist * 0.2;
                        const armIndex = Math.floor(Math.random() * 3);
                        const finalAngle = armAngle + armIndex * (Math.PI * 2 / 3) + spiralOffset;
                        x = armDist * Math.cos(finalAngle);
                        z = armDist * Math.sin(finalAngle);
                        y = (Math.random() - 0.5) * 5 * Math.exp(-armDist/20);
                        break;
                }

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                originalPositions[i * 3] = x;
                originalPositions[i * 3 + 1] = y;
                originalPositions[i * 3 + 2] = z;

                // Color variation
                const hsl = {};
                color.getHSL(hsl);
                const newColor = new THREE.Color();
                newColor.setHSL((hsl.h + (Math.random() - 0.5) * 0.1) % 1, hsl.s, hsl.l + (Math.random() - 0.5) * 0.2);
                
                colors[i * 3] = newColor.r;
                colors[i * 3 + 1] = newColor.g;
                colors[i * 3 + 2] = newColor.b;

                sizes[i] = Math.random() * 1.5 + 0.5;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('originalPosition', new THREE.BufferAttribute(originalPositions, 3));

            const material = new THREE.PointsMaterial({
                size: 1,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function initMediaPipe() {
            videoElement = document.getElementById('webcam-video');
            canvasElement = document.getElementById('webcam-canvas');
            canvasCtx = canvasElement.getContext('2d');

            hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandsResults);

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 320,
                height: 240
            });

            camera.start()
                .then(() => {
                    document.getElementById('loading').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('loading').style.display = 'none';
                    }, 500);
                    updateStatus(true, "摄像头已连接 - 请展示手部");
                })
                .catch(err => {
                    console.error("Camera error:", err);
                    updateStatus(false, "摄像头访问失败");
                    document.getElementById('loading').innerHTML = '<div style="color: #ef4444;">摄像头访问失败<br>请检查权限设置</div>';
                });
        }

        function onHandsResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                handDetected = true;
                updateStatus(true, "追踪中 - 手势控制激活");

                // Draw landmarks
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 3});

                // Calculate hand openness (palm size)
                const wrist = landmarks[0];
                const middleFingerTip = landmarks[12];
                const indexFingerTip = landmarks[8];
                const pinkyTip = landmarks[20];

                // Calculate palm spread
                const spread = Math.sqrt(
                    Math.pow(middleFingerTip.x - wrist.x, 2) + 
                    Math.pow(middleFingerTip.y - wrist.y, 2)
                );

                // Map spread to expansion (0.3 to 0.8 mapped to 0.5 to 3.0)
                targetExpansion = 0.5 + (spread - 0.3) * 5;
                targetExpansion = Math.max(0.3, Math.min(4, targetExpansion));

                // Calculate hand position for rotation control
                // x is 0-1 (left-right), y is 0-1 (top-bottom)
                const handX = 1 - landmarks[9].x; // Invert X for mirror effect
                const handY = landmarks[9].y;

                // Map to rotation angles
                targetRotationY = (handX - 0.5) * Math.PI * 2;
                targetRotationX = (handY - 0.5) * Math.PI;

            } else {
                handDetected = false;
                updateStatus(true, "等待手部检测...");
                // Slowly return to default
                targetExpansion = 1;
                targetRotationX = 0;
                targetRotationY += 0.002; // Auto rotation when no hand
            }

            canvasCtx.restore();
        }

        function updateStatus(active, text) {
            const dot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            dot.className = 'status-dot ' + (active ? 'active' : '');
            statusText.textContent = text;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Smooth interpolation
            currentExpansion += (targetExpansion - currentExpansion) * 0.05;
            currentRotationX += (targetRotationX - currentRotationX) * 0.05;
            currentRotationY += (targetRotationY - currentRotationY) * 0.05;

            // Update particles
            if (particles) {
                const positions = particles.geometry.attributes.position.array;
                const originalPositions = particles.geometry.attributes.originalPosition.array;
                const colors = particles.geometry.attributes.color.array;

                hueShift += 0.001;
                const time = Date.now() * 0.001;

                for (let i = 0; i < particleCount; i++) {
                    const i3 = i * 3;
                    
                    // Apply expansion from center
                    positions[i3] = originalPositions[i3] * currentExpansion;
                    positions[i3 + 1] = originalPositions[i3 + 1] * currentExpansion;
                    positions[i3 + 2] = originalPositions[i3 + 2] * currentExpansion;

                    // Add subtle wave motion
                    positions[i3] += Math.sin(time + i * 0.1) * 0.2;
                    positions[i3 + 1] += Math.cos(time + i * 0.1) * 0.2;

                    // Update colors based on rotation and hue shift
                    const hsl = {};
                    baseColor.getHSL(hsl);
                    const newHue = (hsl.h + hueShift + (currentRotationY / Math.PI) * 0.2) % 1;
                    
                    const color = new THREE.Color();
                    color.setHSL(newHue, hsl.s, hsl.l + Math.sin(time + i * 0.05) * 0.1);
                    
                    colors[i3] = color.r;
                    colors[i3 + 1] = color.g;
                    colors[i3 + 2] = color.b;
                }

                particles.geometry.attributes.position.needsUpdate = true;
                particles.geometry.attributes.color.needsUpdate = true;

                // Apply rotations
                particles.rotation.x = currentRotationX;
                particles.rotation.y = currentRotationY;
            }

            // Rotate background particles slowly
            if (backgroundParticles) {
                backgroundParticles.rotation.y += 0.0002;
                backgroundParticles.rotation.x += 0.0001;
            }

            composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // UI Control Functions
        function setModel(model) {
            currentModel = model;
            createParticleModel(model);
            
            // Update button states
            document.querySelectorAll('.model-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.model-btn').classList.add('active');
        }

        function updateBaseColor(hex) {
            baseColor = new THREE.Color(hex);
            createParticleModel(currentModel);
        }

        function updateDensity(value) {
            particleCount = parseInt(value);
            document.getElementById('density-value').textContent = value;
            createParticleModel(currentModel);
        }

        function updateBloom(value) {
            bloomStrength = parseFloat(value);
            document.getElementById('bloom-value').textContent = value;
            composer.passes[1].strength = bloomStrength;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Initialize
        window.onload = () => {
            initThree();
            initMediaPipe();
        };
    </script>
</body>
</html>
